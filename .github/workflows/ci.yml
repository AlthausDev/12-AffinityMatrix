name: CI

on:
  push:
    branches:
      - develop_*
      - feature_*
      - fix_*
      - hotfix_*
  pull_request:
    branches:
      - develop_*
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
